namespace: example-hotrod

hotrod:
  enabled: true
  image:
    repository: jaegertracing/example-hotrod
    tag: latest
    pullPolicy: IfNotPresent
  args: ["all"]
  service:
    port: 8080
    targetPort: 8080

jaeger:
  replicaCount: 1
  image:
    repository: jaegertracing/jaeger
    tag: latest
    pullPolicy: IfNotPresent
  config:
    configYml: |
      service:
        extensions: [jaeger_storage, jaeger_query]
        pipelines:
          traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [jaeger_storage_exporter, spanmetrics]
          metrics/spanmetrics:
            receivers: [spanmetrics]
            exporters: [prometheus]
        telemetry:
          resource:
            service.name: jaeger
          metrics:
            level: detailed
            readers:
              - pull:
                  exporter:
                    prometheus:
                      host: 0.0.0.0
                      port: 8888
          logs:
            level: DEBUG

      extensions:
        jaeger_query:
          storage:
            traces: some_storage
            metrics: some_metrics_storage
        jaeger_storage:
          backends:
            some_storage:
              memory:
                max_traces: 100000
          metric_backends:
            some_metrics_storage:
              prometheus:
                endpoint: http://prometheus:9090
                normalize_calls: true
                normalize_duration: true

      connectors:
        spanmetrics:

      receivers:
        otlp:
          protocols:
            grpc:
            http:
              endpoint: "0.0.0.0:4318"

      processors:
        batch:

      exporters:
        jaeger_storage_exporter:
          trace_storage: some_storage
        prometheus:
          endpoint: "0.0.0.0:8889"

  service:
    ports:
      - name: http-ui
        port: 16686
        targetPort: 16686
      - name: metrics
        port: 8889
        targetPort: 8889
      - name: grpc
        port: 4317
        targetPort: 4317
      - name: http
        port: 4318
        targetPort: 4318

prometheus:
  image: prom/prometheus:v3.4.0
  config:
    prometheusYml: |
      global:
        scrape_interval:     15s
        evaluation_interval: 15s

      scrape_configs:
        - job_name: aggregated-trace-metrics
          static_configs:
            - targets: ['jaeger.example-hotrod.svc.cluster.local:8889']
