{{- if .Values.hotrod.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotrod
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotrod
  template:
    metadata:
      labels:
        app: hotrod
    spec:
      containers:
        - name: hotrod
          image: "{{ .Values.hotrod.image.repository }}:{{ .Values.hotrod.image.tag }}"
          imagePullPolicy: {{ .Values.hotrod.image.pullPolicy }}
          args: {{ .Values.hotrod.args }}
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger:4318
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://jaeger:4318/v1/traces
          ports:
            - containerPort: {{ .Values.hotrod.service.targetPort }}
---
apiVersion: v1
kind: Service
metadata:
  name: hotrod
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: hotrod
  ports:
    - name: http
      port: {{ .Values.hotrod.service.port }}
      targetPort: {{ .Values.hotrod.service.targetPort }}
{{- end }}


---
# Jaeger ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  namespace: {{ .Values.namespace }}
data:
  config.yml: |
{{ .Values.jaeger.config.configYml | indent 4 }}
---
# Jaeger Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.jaeger.replicaCount }}
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: "{{ .Values.jaeger.image.repository }}:{{ .Values.jaeger.image.tag }}"
          imagePullPolicy: {{ .Values.jaeger.image.pullPolicy }}
          args: ["--config", "/etc/jaeger/config.yml"]
          ports:
{{- range .Values.jaeger.service.ports }}
            - name: {{ .name }}
              containerPort: {{ .targetPort }}
{{- end }}
          volumeMounts:
            - name: jaeger-config
              mountPath: /etc/jaeger/config.yml
              subPath: config.yml
      volumes:
        - name: jaeger-config
          configMap:
            name: jaeger-config
---
# Jaeger Service
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: jaeger
  ports:
{{- range .Values.jaeger.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
{{- end }}
---
# Prometheus ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespace }}
data:
  prometheus.yml: |
{{ .Values.prometheus.config.prometheusYml | indent 4 }}
---
# Prometheus Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
