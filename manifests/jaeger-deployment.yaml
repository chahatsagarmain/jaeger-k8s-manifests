apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: example-hotrod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:latest
          args: ["--config", "/etc/jaeger/config.yml"]
          ports:
            - containerPort: 16686
            - containerPort: 8888
            - containerPort: 8889
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: jaeger-config
              mountPath: /etc/jaeger/config.yml
              subPath: config.yml
      volumes:
        - name: jaeger-config
          configMap:
            name: jaeger-config
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: example-hotrod
spec:
  selector:
    app: jaeger
  ports:
    - name: http-ui
      port: 16686
      targetPort: 16686
    - name: metrics
      port: 8889
      targetPort: 8889
    - name: grpc
      port: 4317
      targetPort: 4317
    - name: http
      port: 4318
      targetPort: 4318
