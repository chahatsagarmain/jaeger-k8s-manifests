collector:
  enabled: true
  image:
    tag: latest
  extraConfigmapMounts:
    - name: jaeger-config
      mountPath: /etc/jaeger/config.yml
      subPath: config.yml
      configMap: jaeger-config
  cmdlineParams:
    config-file: /etc/jaeger/config.yml
  serviceMonitor:
    enabled: true
    interval: 15s
  service:
    type: ClusterIP
    otlp:
      grpc:
        name: otlp-grpc
        port: 4317
      http:
        name: otlp-http
        port: 4318

  extraEnv:
    - name: COLLECTOR_OTLP_ENABLED
      value: "true"
    - name: SPAN_STORAGE_TYPE
      value: elasticsearch

provisionDataStore:
  elasticsearch: true
  cassandra: false


storage:
  type: elasticsearch
  
query:
  enabled: true
  image:
    tag: latest
  service:
    type: ClusterIP
    port: 16686

agent:
  enabled: false

hotrod:
  enabled: true
  args:
    - all
  extraArgs:
    - --otel-exporter=otlp
  extraEnv:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://jaeger-test-collector:4318
    - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      value: http://jaeger-test-collector:4318/v1/traces
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: http/protobuf
    - name: OTEL_SERVICE_NAME
      value: hotrod
    - name: OTEL_LOG_LEVEL
      value: debug